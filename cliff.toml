# git-cliff configuration file
# See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog\n
All notable changes to this project will be documented in this file.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
- **{{ commit.scope }}**: {{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/bpiwowar/obsidian-zotero-annotations/commit/{{ commit.id }}))
{% endfor -%}
{% for commit in commits -%}{% if not commit.scope -%}
- {{ commit.message | split(pat="\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/bpiwowar/obsidian-zotero-annotations/commit/{{ commit.id }}))
{% endif -%}{% endfor -%}
{% endfor %}
"""
trim = true
footer = ""
# Blank line between releases (postprocessors apply to each release)
postprocessors = [{ pattern = "(?m)^## \\[", replace = "\n## [" }]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
    { pattern = "#(\\d+)", replace = "[#$1](https://github.com/bpiwowar/obsidian-zotero-annotations/issues/$1)" },
]
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^bump: version", skip = true },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore: release", skip = true },
    { message = "^chore\\(deps.*\\)", skip = true },
    { message = "^chore\\(pr\\)", skip = true },
    { message = "^chore\\(pull\\)", skip = true },
    { message = "^build\\(deps", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^ci", group = "CI" },
    { message = "^build", group = "Build" },
    { message = "^revert", group = "Revert" },
    { body = ".*security", group = "Security" },
    # Commits before the switch to Conventional Commits (≤ 0.5.1)
    { message = "^Release [0-9]", skip = true },
    { message = ".*", group = "Changes" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "^[0-9]"
# Ignore pre-release tags (1.2.0-beta.1…) so their commits roll up into stable releases
skip_tags = ""
ignore_tags = "^[0-9.]+-"
topo_order = false
sort_commits = "oldest"
# Skip versions with no commits (after filtering)
skip_empty = true
